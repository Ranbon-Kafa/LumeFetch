name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore LumeFetch.sln
      - run: dotnet build LumeFetch.sln --configuration Release --no-restore
      - run: dotnet test LumeFetch.sln --configuration Release --no-build
