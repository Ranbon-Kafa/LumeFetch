name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore LumeFetch.sln
      - run: dotnet build LumeFetch.sln --configuration Release --no-restore
      - run: dotnet test LumeFetch.sln --configuration Release --no-build
      - name: Reject Android runtime library aliases that shadow system libraries
        shell: pwsh
        run: ./scripts/Test-AndroidLibraryIsolationPolicy.ps1
      - name: Verify shared desktop and phone-sized layouts
        run: dotnet run --project tools/LumeFetch.Screenshot --configuration Release --no-build -- artifacts/ui-verification/desktop.png
